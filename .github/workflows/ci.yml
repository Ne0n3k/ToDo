name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode & list project
        run: |
          xcodebuild -version
          ls -la
          ls -la ToDo
          xcodebuild -list -project ToDo/ToDo.xcodeproj

      - name: Install tools
        run: |
          brew update
          brew install swiftlint swiftformat || true

      - name: Lint
        run: swiftlint || true

      - name: Build & Test (Simulator)
        run: |
          set -eo pipefail
          xcodebuild \
            -project ToDo/ToDo.xcodeproj \
            -scheme "ToDo" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean build test
