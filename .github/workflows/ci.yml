name: iOS CI

on:
  push:
    branches: [ "main", "feature/**", "hotfix/**", "release" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14
    env:
      XCODE_VERSION: '16.2'
      XCODE_CONTAINER: ToDo/ToDo.xcodeproj
      SCHEME: ToDo
      SIM_NAME: 'iPhone 16 Pro'
      DERIVED_DATA: ${{ runner.temp }}/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show Xcode (diag)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices
          xcodebuild -list -project "$XCODE_CONTAINER"

      - name: Resolve SPM packages
        run: |
          xcodebuild \
            -project "$XCODE_CONTAINER" \
            -scheme "${SCHEME}" \
            -resolvePackageDependencies

      - name: Build (device, no signing)
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$XCODE_CONTAINER" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath build-device.xcresult \
            clean build

      - name: Build tests (simulator)
        env:
          SIM_OS: 'latest'
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$XCODE_CONTAINER" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${SIM_NAME},OS=${SIM_OS}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath build-tests.xcresult \
            -enableCodeCoverage YES \
            build-for-testing

      - name: Run tests (simulator)
        env:
          SIM_OS: 'latest'
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$XCODE_CONTAINER" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${SIM_NAME},OS=${SIM_OS}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath test.xcresult \
            test-without-building

      - name: Upload xcresult bundles (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: |
            build-device.xcresult
            build-tests.xcresult
            test.xcresult
          if-no-files-found: ignore
