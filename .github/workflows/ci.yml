name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode 16.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Show Xcode
        run: xcodebuild -version

      - name: Locate Xcode project
        run: |
          set -e
          if [ -f "ToDo.xcodeproj/project.pbxproj" ]; then
            echo "XCODE_CONTAINER=ToDo.xcodeproj" >> $GITHUB_ENV
          elif [ -f "ToDo/ToDo.xcodeproj/project.pbxproj" ]; then
            echo "XCODE_CONTAINER=ToDo/ToDo.xcodeproj" >> $GITHUB_ENV
          else
            echo "No .xcodeproj found"; ls -la; [ -d ToDo ] && ls -la ToDo || true; exit 1
          fi

      - name: Install linters (optional)
        run: |
          brew update
          brew install swiftlint swiftformat || true

      - name: Lint
        run: swiftlint || true

      - name: Build (Simulator)
        run: |
          set -eo pipefail
          xcodebuild \
            -project "$XCODE_CONTAINER" \
            -scheme "ToDo" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            clean build
